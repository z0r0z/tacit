# Pass-through for the tacit-pin workers.dev URL. Deploying this config
# replaces the full tacit-pin worker in place, so the workers.dev URL
# forwards to the API origin.
#
#   cd worker/proxy
#   npx wrangler secret put PROXY_TRUST_KEY   # same value as the Render env var
#   npx wrangler deploy -c wrangler.toml

name = "tacit-pin"
main = "src/index.js"
compatibility_date = "2024-12-01"

# The workers.dev API origin older dapp builds call — see worker/wrangler.toml:
# this must stay true or those clients lose the endpoint.
workers_dev = true

# Explicitly empty: the Render service owns scanning. Leaving the section out
# would not remove an existing 5-minute trigger.
[triggers]
crons = []

[vars]
ORIGIN = "https://api.tacit.finance"
