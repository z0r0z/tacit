[package]
name = "fixed-pool-prover"
version = "0.1.0"
edition = "2021"
description = "Browser prover for fixed-denomination pool withdrawals"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
alloy-primitives = { version = "1.7", default-features = false, features = ["std"] }
hex = "0.4.3"
kohaku-tornadocash = "=0.2.0"
rand = "0.10.2"
serde_json = "1"
wasm-bindgen = "=0.2.108"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The pool crate's proving library, with one change to how the circuit's components are run (see
# vendor/README.md): a component set off from inside another's body now waits for that body to end, so a
# long chain of them is not as many nested calls. The proof it makes is the same.
[patch.crates-io]
websnark-rs = { path = "vendor/websnark-rs" }

[workspace]
