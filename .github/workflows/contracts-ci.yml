name: Contracts CI

# Fail-closed guards for the confidential-pool suite. Runs on a clean checkout,
# so it validates the SOURCE OF RECORD — exactly what a fresh clone / CI /
# mainnet deploy compiles. (The deploy scripts additionally refuse a dirty
# working tree; see deploy-*.sh preflight.)
#   - full forge suite (excludes long invariant runs)
#   - confidential SP1 guest ELF == its pinned hash/vkey

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-ci.yml'
  workflow_dispatch:

jobs:
  forge-suite:
    name: Full contract suite (excludes long invariant runs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned alongside forge-std/solady below: on v1.8.3, vm.getNonce(address(this)) increments
          # by 1 when a call FROM this test contract triggers ANOTHER contract's CREATE2, even though
          # the deploying contract (not the caller) is the one whose nonce should move under normal EVM
          # semantics — confirmed with an isolated probe: a plain external call leaves the nonce
          # unchanged, but one that triggers a CREATE2 elsewhere does not. That desyncs
          # CanonicalMinters.t.sol's predict-then-deploy address check (test_fixed_adopts_predeployed_token)
          # from the real deploy address. Not a Tacit bug — v1.5.1 passes the full suite cleanly. Revisit
          # the pin once this is understood/fixed upstream, not by chasing the newest toolchain automatically.
          version: v1.5.1
      - name: Install forge deps (lib/ is gitignored; pinned to the local versions)
        working-directory: contracts
        run: |
          git clone --depth 1 --branch v1.16.1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v0.1.26 https://github.com/Vectorized/solady lib/solady
      - name: forge test
        working-directory: contracts
        # Fork tests need a reliable mainnet RPC; on CI's free public endpoints they rate-limit
        # mid-run (past their own connect-time skip guard). They still run locally.
        run: forge test --no-match-test invariant --no-match-contract Fork

  elf-vkey-pin:
    name: Confidential guest ELF == pinned hash/vkey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confidential guest ELF == pinned hash/vkey
        run: bash contracts/sp1/confidential/verify-vkey-pin.sh

  pool-bytecode-pin:
    name: ConfidentialPool fits EIP-170 == pinned artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1 # bytecode identity depends on the compiler build too; see forge-suite job above
      - name: Install forge deps (lib/ is gitignored; pinned — bytecode identity depends on these versions)
        working-directory: contracts
        run: |
          git clone --depth 1 --branch v1.16.1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v0.1.26 https://github.com/Vectorized/solady lib/solady
      - name: Build ConfidentialPool artifact
        working-directory: contracts
        run: forge build
      - name: ConfidentialPool runtime <= 24576 and == pinned artifact
        working-directory: contracts
        run: bash verify-pool-size.sh

  storage-slot-pins:
    name: Guest-pinned storage slots == compiled layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1 # see forge-suite job above
      - name: Install forge deps (lib/ is gitignored; pinned to the local versions)
        working-directory: contracts
        run: |
          git clone --depth 1 --branch v1.16.1 https://github.com/foundry-rs/forge-std lib/forge-std
          git clone --depth 1 --branch v0.1.26 https://github.com/Vectorized/solady lib/solady
      - name: Guest slot constants == forge storageLayout
        working-directory: contracts/sp1/confidential
        run: bash verify-storage-slots.sh

  lockstep-pins:
    name: Rotated constants share one checkpoint (lockstep)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: vkey / ELF / genesis / batch-vk pins agree on one checkpoint
        working-directory: contracts/sp1/confidential
        run: bash verify-lockstep-pins.sh
