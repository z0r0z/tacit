name: Worker + relay suites
permissions:
  contents: read

# The JS suites for the worker and the relay, on a clean checkout, cut off from the internet.
#
# WHY THIS EXISTS: until 2026-11-16 nothing ran these. Two suites had been red for weeks and no one knew —
# tests/relay-self-funding.test.mjs for six (31 of its checks died on an `export` added inside a span it
# evaluates, and an assertion still demanded a fee policy the relay dropped on 11-05), and
# tests/free-relay-cheap-gas.test.mjs because one case's gas price was served to the next from an eight-second
# cache. Neither was a product fault: both were tests decaying against code that had moved on. That is the
# failure this gate is for — it catches rot, which is invisible precisely because nobody is looking.
#
# OFFLINE ON PURPOSE (tools/noweb.cjs): a suite that reaches a public node passes on a good day and fails on a
# bad one, and a gate that fails for reasons unrelated to the diff is one people learn to ignore. Suites that
# genuinely need the live chain are named, with reasons, in tools/run-js-suites.mjs SKIP; the mainnet canary
# keeps its own schedule in canary.yml, where an unreachable host is inconclusive rather than a failure.
#
# Everything matching the runner's patterns runs. A new suite is covered the moment it is added — a list of
# suites to RUN would rot exactly the way the two above did.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'worker-relay/**'
      - 'tests/**'
      - 'tools/run-js-suites.mjs'
      - 'tools/noweb.cjs'
      - '.github/workflows/js-suites.yml'
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'worker-relay/**'
      - 'tests/**'
      - 'tools/run-js-suites.mjs'
      - 'tools/noweb.cjs'
      - '.github/workflows/js-suites.yml'
  workflow_dispatch:

# On a pull request a later push supersedes the run still going: only the newest state of the branch matters.
# NOT on main. Pushes here land minutes apart from several people at once, and cancelling meant a commit could be
# superseded before it was ever judged — the gate's own second run was cancelled 90 seconds in, by the next push.
# A commit that reaches main gets its own verdict, so a failure can be traced to the change that caused it.
concurrency:
  # On a pull request, one run per branch and a later push cancels the earlier: only the newest state matters.
  # On main the group is the COMMIT, so runs neither cancel nor queue behind each other — every commit gets its own
  # verdict, at the same time as the others. Sharing a group on main is wrong in both settings: cancelling loses the
  # verdict (two of this gate's first three runs were cancelled by the next push, 90 s in), and queueing delays it
  # behind every push that followed, which on a branch this busy is just as useless.
  group: js-suites-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    name: Worker + relay suites (offline)
    runs-on: ubuntu-latest
    # About 40 minutes of suites, so ~20-25 min two at a time; the cap leaves room rather than cutting a run short.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # A few suites start a BARE anvil (no fork) and drive it over localhost — hermetic, but they need the binary,
      # and without it they fail with `spawn anvil ENOENT` rather than skipping. The ones that start
      # `anvil --fork-url <public node>` cannot run offline at all and are named in the runner's SKIP instead.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1 # the version contracts-ci.yml pins

      # FOUR npm packages, and the suites resolve against all four: a tests/ suite reads the repo root's node_modules by
      # path, worker-relay's own suites import bare specifiers (viem, better-sqlite3) from theirs, and two suites import
      # `../worker/node_modules/@noble/...` by path, which is a directory that only exists if worker/ is installed too
      # (leaving it out is what failed tests/worker-amm-parity and tests/community-ops on this gate's first run, where
      # both pass locally because a developer's tree has all four). `npm ci` honours each lockfile; a failure in these
      # steps is a dependency problem, not a test one.
      - name: Install (root)
        run: npm ci --no-audit --no-fund
      # tests/ is deliberately NOT installed. It has a package.json of its own, but its lockfile pins @noble/hashes 1.3.3
      # while the root pins 1.8.0, and 1.3.3 does not export './sha3.js' — so installing it put an older copy in front of
      # the root one and broke `import { keccak_256 } from '@noble/hashes/sha3.js'` in tests/community-ops.test.mjs with
      # ERR_PACKAGE_PATH_NOT_EXPORTED. No developer's tree has tests/node_modules (the suites resolve up to the root), so
      # installing it made CI differ from every machine these suites are written and run on. The root package provides
      # everything tests/package.json lists. The stale tests/ lockfile is a real inconsistency, but fixing it is a
      # dependency bump for the bulletproofs/snarkjs suites that own that package, not something this gate should force.
      - name: Install (worker)
        run: npm ci --no-audit --no-fund
        working-directory: worker
      - name: Install (worker-relay)
        run: npm ci --no-audit --no-fund
        working-directory: worker-relay

      - name: List what runs
        run: node tools/run-js-suites.mjs --list

      # --jobs 2 and a long per-suite cap on purpose. These suites are CPU-bound (proving, fuzzing, parity
      # checks), so running more of them at once than the runner has cores does not finish sooner — it starves
      # each one until it trips the cap, and a timeout says nothing about the diff. Measured on a loaded laptop
      # (load ~40, 4 jobs): suites that take 11-50 s idle ran past 180 s. If this job reports timeouts, lower
      # --jobs or raise --timeout before suspecting the suites.
      - name: Run the suites
        run: node tools/run-js-suites.mjs --offline --jobs 2 --timeout 300
