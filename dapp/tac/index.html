<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Its one inline script is pinned by sha256 in script-src by build/build.mjs. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-uF8iX1J9p2fv7ZA4kWmNv880/P3dJ4+drb+CVdBbuY8='; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>tacit TAC</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tacit.finance/#tac">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>html,body{margin:0;background:#E8E0CC;color:#1A1A1A;font:14px/1.6 ui-monospace,monospace}p{padding:24px 16px;margin:0}a{color:inherit}@media(prefers-color-scheme:dark){html,body{background:#15130E;color:#EDE5CF}}</style>
<script>
  // TAC's shielded pool on Bitcoin is in TAC's home on the front page (#tac). A link made for this page goes there with what it carried: a claim
  // link's fragment as it is, a tab as the pool's tab there, and the old market links to TAC's page.
  (function () {
    var h = location.hash || '', at = h.lastIndexOf('tacclaim='), tab = /^#(shield|send|withdraw|receive)(\/sats)?$/i.exec(h);
    location.replace(at !== -1 ? '/#tacclaim=' + h.slice(at + 9).split(/[&#\s]/)[0]
      : /^#(buy|market)\b/i.test(h) ? '/trade/tac/#btc=buy'
      : tab ? '/#tac/pool/' + tab[1].toLowerCase() + (tab[2] && /^withdraw$/i.test(tab[1]) ? '/sats' : '')
      : '/#tac');
  })();
</script>
</head>
<body>
<p>TAC’s shielded pool is now on the front page. <a href="/#tac">Open TAC →</a></p>
</body>
</html>
