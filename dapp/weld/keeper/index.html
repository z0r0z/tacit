<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Community ops moved to /prove/ (its Relay and Bitcoin tabs). This page only sends a visitor there, keeping a waiting lock's or
     deposit's #need=<height>&why=lock|bridge and taking an old section anchor to its tab. Its one inline module is hash-pinned in
     script-src by build/build.mjs. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-xyCO11mrZqJs3zq24w4CI0st8TTI1UGoE0beB0H8IzE='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>tacit prove</title>
<link rel="canonical" href="https://tacit.finance/prove/">
<style>body { margin: 0; padding: 32px 16px; font: 14px/1.6 ui-monospace, Menlo, monospace; background: #E8E0CC; color: #1A1A1A; } a { color: inherit; }
@media (prefers-color-scheme: dark) { body { background: #15130E; color: #EDE5CF; } }</style>
</head>
<body>
<p>Community ops is now part of <a href="/prove/#tab=bitcoin">tacit prove</a>.</p>
<script type="module">
const h = new URLSearchParams(location.hash.slice(1)), need = h.get('need'), why = h.get('why');
const ANCHOR = { 'g-board': 'relay', 'g-run': 'relay', 'g-mine': 'prove', 'g-prove': 'prove' };
const out = new URLSearchParams({ tab: need ? 'bitcoin' : ANCHOR[location.hash.slice(1)] || 'bitcoin' });
if (/^\d{1,8}$/.test(need || '')) out.set('need', need);
if (/^(lock|bridge)$/.test(why || '')) out.set('why', why);
location.replace(`/prove/#${out.get('tab') === 'prove' ? '' : out}`);
</script>
</body>
</html>
