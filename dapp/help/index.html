<style>

:root {
  --paper: #E8E0CC; --card: #F2EBD4; --field: #FAF6EA;
  --ink: #1A1A1A; --mute: #625C4F;
  --hair: rgba(26,26,26,.12); --hair-2: rgba(26,26,26,.28);
  --orange: #f7931a; --ok: #0a7234; --warn: #9a4a00; --err: #b8341d;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif: 'Instrument Serif', 'Instrument Serif Fallback', 'Instrument Serif Fallback T', 'Instrument Serif Fallback N', Georgia, serif;
  --tap: 44px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15130E; --card: #1F1C15; --field: #191711;
    --ink: #EDE5CF; --mute: #A39B85;
    --hair: rgba(237,229,207,.12); --hair-2: rgba(237,229,207,.28);

:root { --red: var(--err); --amber: var(--warn); --green: var(--ok); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font: 14px/1.6 var(--mono); letter-spacing: -.01em; overflow-x: hidden;
  background-image: radial-gradient(var(--hair) 1px, transparent 1px); background-size: 24px 24px;

a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
button, select, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.mute { color: var(--mute); }
.err { color: var(--err); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tk { width: 28px; height: 28px; display: block; flex: none; border-radius: 50%; }

.shell { max-width: 1060px; margin: 0 auto; padding-bottom: 56px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0 8px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.brand b { font: italic 400 30px/1 var(--serif); letter-spacing: -.01em; }

/* the head */

.hero h1 em { font-style: italic; }
.hero .sub { margin: 12px 0 0; color: var(--mute); font-size: 13px; max-width: 64ch; }

/* the question and its answer */
.panel { background: var(--card); border: 1px solid var(--hair); padding: 22px; min-width: 0; max-width: 680px; }

.eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 0 0 12px; }
.eyebrow .who { letter-spacing: 0; text-transform: none; font-size: 11.5px; }
.eyebrow .who.warn { color: var(--warn); }
#q { display: block; width: 100%; min-height: 104px; padding: 12px; resize: vertical; background: var(--field); border: 1px solid var(--hair-2); border-radius: 0; }
#q:focus-visible { outline-offset: 0; border-color: var(--ink); }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; margin-top: 12px; padding: 10px 16px; font-weight: 500;
  color: var(--card); background: var(--ink); border: 1px solid var(--ink); cursor: pointer; transition: background .15s, color .15s; }
@media (hover: hover) { .btn:hover:not(:disabled) { background: transparent; color: var(--ink); } }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.eg { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.eg button { min-height: 34px; padding: 4px 10px; font-size: 12px; text-align: left; cursor: pointer; background: none; border: 1px solid var(--hair-2); }

#out:empty { display: none; }
#out { margin-top: 18px; border-top: 1px solid var(--hair); padding-top: 16px; }
#out .status { margin: 0; font-size: 12.5px; color: var(--mute); overflow-wrap: anywhere; }
#out .status.err { color: var(--err); }
#out .a { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
#out .src, #out .fine { margin: 12px 0 0; font-size: 12px; color: var(--mute); overflow-wrap: anywhere; }
#out .fine { margin-top: 4px; }

/* framed by the help panel: the site's header, the page heading and the footer are left out, and the panel's own surface shows */
html.embed .top, html.embed .hero h1, html.embed footer.sf { display: none; }
html.embed, html.embed body { background: var(--card); background-image: none; }
html.embed body { padding: 0; }
html.embed .shell { max-width: none; padding: 0; }
html.embed .hero { padding: 14px 16px 0; }
html.embed .hero .sub { margin: 0; font-size: 12px; }
html.embed .panel { max-width: none; border: 0; background: transparent; padding: 14px 16px 18px; }
html.embed #q { min-height: 84px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<style>
/* The header's page links and the footer, as every page that wears them draws them. The markup is made by build/chrome.mjs and stamped
   into the pages (`npm run build`); a page keeps only its own tokens (--ink --mute --card --hair --hair-2 --orange --mono --spring)
   and its brand, chips and spacing. Nothing here is a size the page has to agree with: the header's width is read from the header. */

header.top { position: relative; z-index: 30; container: top / inline-size; }
header.top .top-r { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; }

/* page links: six in the header (icons, then icons and names as the header gets wide), the rest in the menu; on a phone all of them are there */
.sn { display: flex; align-items: center; gap: 2px; }
.sn > a, .sn summary {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; flex: none;
  height: 40px; min-width: 40px; padding: 0 9px; border-radius: 12px; color: var(--mute);
  font: 500 12.5px/1 var(--mono); text-decoration: none; list-style: none; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  transition: color .15s, background-color .15s, transform .25s var(--spring, ease);
}
.sn summary::-webkit-details-marker { display: none; }
/* the menu is a <details>: a page's own rules for details and summary (a border, a "+", a margin) are not for it */

header.top .sm > summary { display: flex; min-height: 0; }
header.top .sm > summary::before, header.top .sm > summary::after { content: none; }
.sn svg, .sf svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sn svg.fill, .sf svg.fill { fill: currentColor; stroke: none; }
.sn > a { display: none; }
.sn > a span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.sn > a[aria-current="page"], .sn summary.here, .sm[open] > summary { color: var(--ink); background: var(--hair); }
@media (hover: hover) { .sn > a:hover, .sn summary:hover { color: var(--ink); background: var(--hair); } }
.sn > a:active, .sn summary:active { transform: scale(.93); }
.sn a:focus-visible, .sn summary:focus-visible, .sf a:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
@container top (min-width: 540px) { .sn > a { display: inline-flex; } }
.sn > a[href="/rewards/"], .sn .sm > summary { position: relative; }
.sn[data-owed] > a[href="/rewards/"]::after, .sn[data-owed] .sm > summary::after { content: ''; position: absolute; top: 8px; left: 26px; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 2px var(--paper, transparent); }
@container top (min-width: 540px) { .sn[data-owed] .sm > summary::after { display: none; } }
@container top (max-width: 539px) { .sn[data-owed] > a[href="/rewards/"]::after { display: none; } }
/* a bridge under way: a dot on the header's Bridge link, or on the menu button where the links are in the menu (chrome.js adds both) */
.sn .bd { position: absolute; top: 5px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 2px var(--paper, transparent); pointer-events: none; }
.sn > a > .bd { top: 8px; right: auto; left: 26px; width: 7px; height: 7px; }
@container top (min-width: 540px) { .sn .sm > summary > .bd { display: none; } }
/* the Activity link chrome.js adds on a page without its own chip: at every width, once there is something in it, with the count still going */
.sn > a.sa:not([hidden]) { display: inline-flex; }
.sn > a.sa .n { position: absolute; top: 3px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: var(--orange); color: #fff; font: 600 10px/16px var(--mono); text-align: center; }
@container top (min-width: 900px) {
  .sn > a { padding: 0 13px 0 11px; }
  .sn > a span { position: static; width: auto; height: auto; overflow: visible; clip-path: none; }
}

/* a very narrow header keeps the mark and the name; the page's label, and the Activity and total chips' room, go first */
@container top (max-width: 340px) { header.top .brand i { display: none; } }

/* the account chip (and, on the front page, Activity and the total): a quiet outline on the page's own ground, not a block; the dot says whether a wallet is open */
header.top .chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; flex: 0 1 auto; min-width: 0; height: 40px; margin: 0; padding: 0 16px 0 13px;
  color: var(--ink); background: transparent; border: 1px solid var(--hair-2, var(--hair-strong, var(--hair))); border-radius: 999px;
  font: 500 12.5px/1 var(--mono); white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent;

header.top .chip > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
header.top .chip .dot { width: 7px; height: 7px; margin: 0; border-radius: 50%; background: var(--hair-2, var(--hair-strong, var(--hair))); flex: none; vertical-align: 0; }
header.top .chip .dot.on { background: var(--ok); }
header.top .chip .dot.warn, header.top .chip .dot.live { background: var(--orange); }
header.top .chip.act { position: relative; width: 40px; padding: 0; color: var(--mute); border-color: transparent; }
header.top .chip.act[aria-expanded="true"], header.top .chip.act:hover { color: var(--ink); }

header.top .chip:active { transform: scale(.97); }
header.top .chip:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
@container top (max-width: 480px) { header.top .chip { padding: 0 12px 0 11px; } header.top .chip.act { padding: 0; } }
@media (pointer: coarse) { .sn > a, .sn summary, header.top .chip, footer.sf nav a { height: var(--tap, 44px); } }
/* Touch, on every page that wears this: a quick double tap on a control does not zoom the page, and a text button takes a press a thumb can land (its box does not
   change: the target reaches past it). */
@media (pointer: coarse) {
  a, button, summary, input, select, textarea, label, [role="button"], [role="tab"] { touch-action: manipulation; }
  button.link, .linkbtn { position: relative; }
  button.link::after, .linkbtn::after { content: ''; position: absolute; inset: -8px -6px; }
  /* the mark and name at the header's left are 26-30px tall: the target reaches to the chips' 44 */
  header.top a.brand { position: relative; }
  header.top a.brand::after { content: ''; position: absolute; inset: -8px -6px; }
}

/* the menu: under the header's right edge, whatever the width */
.sm-p {
  position: absolute; z-index: 5; top: calc(100% + 8px); right: 0; display: grid; gap: 1px; box-sizing: border-box;
  width: max-content; min-width: 220px; max-width: calc(100vw - 32px); padding: 6px;
  background: var(--card); border: 1px solid var(--hair-2, var(--hair)); border-radius: 16px;
  box-shadow: 0 24px 48px -26px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.06);

@keyframes sm-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }

.sm-p a svg { width: 18px; height: 18px; color: var(--mute); }
.sm-p a[aria-current="page"] { background: var(--hair); }

@container top (min-width: 540px) { .sm-p .pr { display: none; } }
@media (hover: hover) { .sm-p a:hover { background: var(--hair); } }
@media (prefers-reduced-motion: reduce) { .sm-p { animation: none; } .sn > a, .sn summary, header.top .chip { transition: none; } }

/* the footer: where it is said to be, then the places outside the app, as icons that say their name on hover and to a screen reader (they narrow a little on a small phone before they would run off the page) */
footer.sf { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 20px; margin-top: 56px; padding: 10px 0 22px; border-top: 1px solid var(--hair); color: var(--mute); font: 400 12px/1.4 var(--mono); }

footer.sf nav a { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; flex: 0 1 40px; min-width: 28px; height: 40px; border-radius: 12px; color: var(--mute); transition: color .15s, background-color .15s, transform .25s var(--spring, ease); }

footer.sf svg { width: 18px; height: 18px; }
footer.sf svg.fill { width: 16px; height: 16px; }
@media (hover: hover) { footer.sf nav a:hover { color: var(--ink); background: var(--hair); } }
@media (max-width: 480px) { footer.sf nav { margin: 0 0 0 -11px; } }

/* what only one page has to point at (papers, the pool on each chain): a quiet line above the footer */
.sf-x { display: flex; flex-wrap: wrap; align-items: center; gap: 0 18px; margin-top: 48px; color: var(--mute); font: 400 12px/1.4 var(--mono); }
.sf-x + footer.sf { margin-top: 12px; }
.sf-x span { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
