# bitcoind for the gateway and electrs. The RPC password (rpcauth) and dbcache come from .env on the command line (docker-compose.yml).
#
# Unpruned with txindex: every transaction by id, with its prevouts and fee (getrawtransaction verbosity 2 reads the undo data), which is how the
# gateway answers esplora's /tx reads without Blockstream's esplora index. ~0.8 TB of blocks + ~70 GB txindex + ~12 GB chainstate (Nov 2026).
server=1
disablewallet=1
txindex=1
prune=0

# P2P: a normal peer, gentle on the uplink once synced (recent blocks are still served; old ones stop after the daily budget, in MiB)
listen=1
maxconnections=40
maxuploadtarget=5000

# The mempool feeds fee estimates and the mempool reads
maxmempool=300

# RPC: the compose network only (172.28.0.0/16 is pinned in docker-compose.yml), never published beyond loopback
rpcbind=0.0.0.0
rpcallowip=172.28.0.0/16
rpcallowip=127.0.0.1
rpcthreads=8
rpcworkqueue=128

printtoconsole=1
