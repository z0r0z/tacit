# Render blueprint — Tacit confidential-pool relay + reflection backbone.
#
# Proving is offloaded to the Succinct NETWORK prover; no GPU on Render. Two always-on
# Background Workers (settle + eth-state) plus Cron Jobs (reflection, header, monitor).
#
# The prebuilt Rust prover binaries are fetched into the image by the Dockerfile from a
# pinned GitHub release (see README). Secrets are sync:false — set them in the Render dashboard.
#
# Shared env lives in an env group so every service inherits WORKER_BASE / RPC_URL /
# addresses / Succinct config without repetition; only the secrets differ per-need.

envVarGroups:
  - name: tacit-relay-shared
    envVars:
      - key: WORKER_BASE
        value: https://api.tacit.finance   # control-plane worker base URL
      - key: NETWORK
        value: mainnet
      - key: CHAIN_ID
        value: "1"
      - key: POOL_ADDR
        value: "0x000000000Ed1eabD231Be41d93b719056F7febFC"
      - key: HEADER_RELAY_ADDR
        value: "0x20A6ddc2C6E620c6248B5A34E85996516FDd19D0"
      - key: VAPP_DEPOSIT_ADDR
        value: "0x5Ad5Bc4B18f7c173DcE17A57682Cb0Dc8788951F"
      - key: PROVE_TOKEN_ADDR
        value: "0x6BEF15D938d4E72056AC92Ea4bDD0D76B1C4ad29"
      # Deprecated the previous 0x000000a7… quoter 2026-09-23 — its buildSwapAuto had no PROVE->ETH route,
      # silently mispricing PROVE. This one has no single "auto" function either, so replenish.js's quote()
      # tries buildBestSwap + buildBestSwapViaETHMulticall and keeps the better result — see chain.js.
      - key: ZQUOTER_ADDR
        value: "0x000000bd2DB80567c23E353ca95a251c573cBf9B"
      - key: ZROUTER_ADDR
        value: "0x000000000000FB114709235f1ccBFfb925F600e4"
      - key: SP1_PROVER
        value: network
      # Mainnet/auction endpoint. The exec-* binaries build in Mainnet (auction) mode — auction gRPC calls
      # (get_proof_request_params) are Unimplemented on the Reserved endpoint (rpc.production), so this MUST be
      # the mainnet host or every network prove fails with `status: Unimplemented`.
      - key: NETWORK_RPC_URL
        value: https://rpc.mainnet.succinct.xyz
      # The pool verifies ONE immutable program_vkey. A prover binary built against a different guest
      # produces proofs that generate fine and are rejected on-chain, with nothing in the logs to say so.
      # Pinning the expected vkey here makes the harness assert it at startup and fail loudly instead. Rotate this together with
      # the guest ELF pin and the on-chain program_vkey; never on its own.
      - key: EXPECT_VKEY
        value: "0x006cd47fd23937a6d247696cace28c22d2c6a8280447e6ac45a3571de232d6e3"
      - key: BITCOIN_PROVE_BIN
        value: /app/prover/bin/bitcoin_prove
      - key: EXEC_BIN
        value: /app/prover/bin/exec
      # Fee economics (see src/replenish.js quoteRelayFee)
      - key: MIN_FLOOR_USD
        value: "0.5"
      - key: OPS_MARGIN
        value: "0.12"
      - key: BPS_CAP
        value: "30"
      # ── Secrets (set in dashboard) ──
      - key: RPC_URL
        sync: false
      - key: RELAY_KEY
        sync: false
      - key: BOX_TOKEN
        sync: false
      # Must equal the worker's PROVER_HEARTBEAT_TOKEN. Without it every heartbeat is rejected 401 and
      # /prover-health reports these services down forever — which is how a wedged lane goes unnoticed.
      - key: PROVER_HEARTBEAT_TOKEN
        sync: false
      - key: NETWORK_PRIVATE_KEY
        sync: false
      # Every service's escalation channel, not just the monitor's. header-relay.js has its own alert() and it
      # is the SOLE escalation for a Bitcoin fork deeper than HEADER_RELAY_REORG_DEPTH — the one event meaning
      # the light relay's view of the chain was materially wrong. Scoped to tacit-monitor alone, that alert
      # no-opped into the logs, and because the header cron SUCCEEDS while restoring, Render's failed-run
      # signal never fired either. Same for the eth-state sidecar's own stall escalation.
      - key: ALERT_WEBHOOK_URL
        sync: false

services:
  # Always-on worker: Mode-B eth-state producer (src/eth-state-sidecar.js). Publishes the eth-side
  # crossOut/consumed candidate tacit-reflection's ethBundleSource needs for every Mode-B attest — see
  # that file's header comment for why this must track "is a candidate currently live," not
  # crossOutCount, and self-paces to roughly one real eth_prove run per Bitcoin-side attest.
  # NOT type: cron — eth_prove keeps its own cumulative resume state on a local file across cycles
  # (out_dir()/eth_set_state.json); a cron's fresh-container-per-run would force a full eth_getLogs
  # rescan from DEPLOY_BLOCK on every single invocation, growing without bound as history accumulates.
  # The attached disk makes that state (and the pending eth_set_state.pending.json) survive
  # restarts/redeploys too — losing it is a one-time expensive rescan, not a correctness issue (see
  # prover.js's proveEthState comment), but avoid relying on that as normal operation.
  #
  # DO NOT deploy this without first setting the REAL secrets below AND confirming SOURCE_CONSENSUS_RPC/
  # SOURCE_EXECUTION_RPC/DEPLOY_BLOCK/GENESIS_SLOT/ETH_CALL_OUTBOX match the live deployment
  # (re-pin them for a successor deployment). Start with DRY_RUN=1 for at least
  # one full cycle against production before removing it (validates the trigger + API wiring with zero
  # proving spend).
  - type: worker
    name: tacit-eth-state
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: standard
    # Since 2026-10-16 the whole Bitcoin lane (src/bitcoin-lane.js): this eth-state producer, the reflection folder that was the
    # tacit-reflection cron, and the header feeder that was the tacit-header cron, run in turn in this one process. Standard (2 GB)
    # holds the lane's peak because the three never prove at once: an eth_prove or a bitcoin_prove child is over a gigabyte, and one
    # runs at a time. Each stage can be switched off (LANE_* = 0) while its own file runs elsewhere. The lane beats each stage's
    # idle note to /prover-health (eth-state, reflection) as the single services did.
    dockerCommand: node src/bitcoin-lane.js
    autoDeploy: false
    disk:
      name: eth-prove-state
      mountPath: /var/lib/tacit-eth-prove
      sizeGB: 5
    envVars:
      - fromGroup: tacit-relay-shared     # reuses NETWORK_PRIVATE_KEY, BOX_TOKEN, SP1_PROVER, NETWORK_RPC_URL
      - key: ETH_PROVE_BIN
        value: /app/prover/bin/eth_prove   # fetched into the image by the Dockerfile
      - key: DRY_RUN
        value: "0"
      - key: ETH_STATE_POLL_SECS
        value: "60"
      # ── the lane's other two stages ──
      - key: LANE_ETH_STATE
        value: "1"
      - key: LANE_REFLECTION
        value: "1"
      - key: LANE_HEADERS
        value: "1"
      - key: LANE_IDLE_SECS
        value: "30"
      # The reflection folder, as its cron ran it (its cycle and gas limits; the group's MAX_GAS_GWEI=5 holds its attests back only in a
      # real spike). It polls every REFLECTION_POLL_SECS when caught up and goes again at once after a landed batch.
      - key: REFLECT_CYCLE_LIMIT
        value: "50000000000"
      # A request reserves this limit at the network's price cap plus a base fee from the prover credit, whatever the batch really
      # uses (2-11B since the provenance hop allowance): 20B holds back about 13 PROVE, 30B about 20, and a credit under that stops the lane.
      - key: REFLECT_GAS_LIMIT
        value: "20000000000"
      - key: REFLECTION_POLL_SECS
        value: "30"
      # The header feeder, as its cron ran it: every three minutes, batches of 20 at up to 0.3 gwei (its own ceiling, HEADER_MAX_GAS_GWEI:
      # headers can wait for cheap gas, an attest should not), forced past 144 blocks of staleness, kept 110 blocks ahead of the reflection.
      - key: HEADER_EVERY_SECS
        value: "180"
      - key: HEADER_RELAY_LEAD
        value: "110"
      - key: HEADER_RELAY_MAX_BATCH
        value: "20"
      - key: HEADER_RELAY_MIN_BATCH
        value: "20"
      - key: HEADER_RELAY_MAX_STALE_BLOCKS
        value: "144"
      - key: HEADER_MAX_GAS_GWEI
        value: "0.3"
      # ── deployment-pinned constants — re-pin for a successor deployment ──
      - key: SOURCE_CONSENSUS_RPC
        value: https://ethereum-beacon-api.publicnode.com
      - key: SOURCE_CHAIN_ID
        value: "1"
      - key: SOURCE_EXECUTION_RPC
        value: https://mainnet.gateway.tenderly.co
      - key: SOURCE_PROOF_RPC
        value: https://eth-mainnet.public.blastapi.io
      - key: ETH_CALL_OUTBOX
        value: "0x00000000a26a6E291972666a9687741dBa11Af46"
      - key: DEPLOY_BLOCK
        value: "25998736"
      # The resume digest carries the sync committee the last Mode-B cycle ended on; the eth proof must
      # bootstrap from a slot in that period, since an older bootstrap replays periods the network refuses as
      # unexecutable. Chained mode then follows the committed state's landed slot, so no fixed
      # committee pin is set: the expected committee advances every period and the assembler checks it per job.
      - key: GENESIS_SLOT
        value: "15237120"
      - key: SYNC_COMMITTEE_MODE
        value: chained
      - key: SCAN_CHUNK
        value: "300"
      - key: SCAN_DELAY_MS
        value: "600"
      - key: ETHPROVE_CYCLE_LIMIT
        value: "3000000000"
      - key: ETHPROVE_GAS_LIMIT
        value: "3000000000"

  # Always-on worker: confidential settle relay (user ops). Polls the queue every SETTLE_POLL_SECS
  # and proves+settles immediately — no 2-min cron lag, so a user's wrap/send/top-up settles promptly.
  # (Revert to a per-run Cron Job by setting type: cron + schedule + RUN_MODE=cron if cost matters more.)
  - type: worker
    name: tacit-settle
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    # Standard (2GB): the SP1 network-prove client spikes past 512MB (Starter) when it retrieves + deserializes
    # the groth16 proof, so it needs 2GB.
    plan: standard
    dockerCommand: node src/settle-relay.js
    autoDeploy: false
    # A deploy sends SIGTERM and the relay finishes the job in hand (src/settle-relay.js): a proof on the board takes up to a few minutes, so Render
    # waits for it (its default is 30 s, after which the process is killed and the job sits claimed until its 16-minute claim lapses).
    maxShutdownDelaySeconds: 240
    envVars:
      - fromGroup: tacit-relay-shared
      # No per-service POOL_ADDR override: the group's POOL_ADDR is the single source for every service.
      - key: SETTLE_JOB_TIMEOUT_SECS
        value: "900"
      # Tight poll so a queued job starts proving within ~3s — the worker is always-on, so the extra idle GETs
      # are cheap.
      - key: SETTLE_POLL_SECS
        value: "3"
      # Ceiling, not a target: the relay batches whatever is already queued and never waits to fill, so a
      # lone op still settles immediately on the single-op path. Gas is charged per settle and the proof's fixed
      # work once per proof (a shard holds ~35 ordinary ops), so batch members split both. 1 disables batching.
      - key: SETTLE_BATCH_MAX
        value: "16"
      # Ops of different types in one settle too (every type the open board takes), proved from one program input the
      # relay builds and requests from the network itself (lib/stdin-prover.js): the request's fixed cost is split across
      # the batch. A batch the network could not execute rests this for half an hour and its members settle alone.
      - key: SETTLE_BATCH_MIXED
        value: "1"
      # A lone op waits for company at most this long, and only while jobs have been arriving faster than that (the wait is the
      # expected gap to the next job, less what the op already waited; two queued halve it). Shared proof and gas, and company
      # in the settle. 0 disables the wait.
      - key: SETTLE_BATCH_WAIT_MAX_SECS
        value: "90"
      # How long a submitted settle is given to land before the next round repeats it with three times the tip. Measured over
      # 37 settles (2026-10-16): the ones that land at the first tip do so inside ~50 s, the rest sat out the whole 90 s and
      # landed within seconds of the repeat, so a shorter round brings a third of settles forward by ~40 s for the few that
      # would have landed late at the low tip paying the higher one.
      - key: SETTLE_RECEIPT_WAIT_MS
        value: "48000"
      # Tacit's prover board first (lib/board-prover.js): a settle proof is offered to the workers pulling from the API's
      # /prover/* routes (worker/src/prover-board.js, tokens in the API's PROVER_WORKER_TOKENS) for PROVER_BOARD_WAIT_SECS,
      # then goes to the prover network as before. Off until a worker runs.
      - key: PROVER_BOARD
        value: "1"
      - key: PROVER_BOARD_WAIT_SECS
        value: "180"
      # Ordered PRIVATE submission endpoints. A settle pays its bound fee to msg.sender, so it is kept out of
      # the public mempool; several endpoints mean one refusing a valid tx does not discard a paid proof.
      - key: SETTLE_RPC_URLS
        value: "https://rpc.flashbots.net,https://rpc.mevblocker.io"
      # Last resort after every private endpoint refuses: the user's op still settles, though the bound fee
      # may go to another submitter. 0 keeps submission private-only.
      - key: SETTLE_ALLOW_PUBLIC
        value: "0"
      # Settles are signed with SETTLE_KEY, set on this service, so they no longer share a nonce with the
      # header relay and the reflection folder (which share RELAY_KEY with each other). Fee income therefore
      # lands on the settle wallet rather than the account that funds proving, which is what replenish moves
      # across during idle time; SETTLE_ADDRESS must name the same account so the monitor watches it.
      #
      # Fee income -> ETH gas + PROVE, swept from inside this service during idle time (see replenishOnce).
      - key: REPLENISH_IN_SETTLE
        value: "1"
      - key: REPLENISH_INTERVAL_MIN
        value: "30"
      - key: FEE_ASSETS
        value: "0x0000000000000000000000000000000000000000,0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48,0xdAC17F958D2ee523a2206206994597C13D831ec7,0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0"
      # TAC collected as relay fees is never sold; replenish moves it to the ops multisig once it reaches 100 TAC.
      - key: TAC_RESERVE_ADDR
        value: "0x006CD14F36F65eCbB29b2519cCBe63A0DC8549F2"
      # A quarter of the relay's genuine ETH surplus (what would otherwise become PROVE) goes to TacBuyback.
      - key: BUYBACK_ADDR
        value: "0x6919cbEf0e70AFFA02Ae02c86c532A137154f250"
      - key: BUYBACK_SHARE_BPS
        value: "0"

  # TacBuyback keeper (contracts/src/TacBuyback.sol). Hourly: if the contract holds ETH and its cooldown has passed,
  # buys TAC for the ops reserve on whichever TAC/ETH venue quotes better, through private endpoints only. Its own
  # key, never RELAY_KEY: the keeper can only buy into the reserve, and stays off the relay key's nonce.
  - type: cron
    name: tacit-buyback
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "23 * * * *"
    dockerCommand: node src/buyback-keeper.js
    autoDeploy: false
    envVars:
      # BUYBACK_KEEPER_KEY lives in its own group, linked to this service only.
      - fromGroup: tacit-buyback
      - key: RPC_URL
        value: "https://ethereum-rpc.publicnode.com"
      - key: BUYBACK_ADDR
        value: "0x6919cbEf0e70AFFA02Ae02c86c532A137154f250"
      - key: SETTLE_RPC_URLS
        value: "https://rpc.flashbots.net,https://rpc.mevblocker.io"

  # Cron: balance + reflection-lag pager. It only reads, so it is DELIBERATELY NOT in tacit-relay-shared (which carries RELAY_KEY and
  # the prover key): it names the wallets it watches by address and holds only the tokens it needs to read the API.
  - type: cron
    name: tacit-monitor
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "*/5 * * * *"
    dockerCommand: node src/balance-monitor.js
    autoDeploy: false
    envVars:
      - key: WORKER_BASE
        value: https://api.tacit.finance
      - key: NETWORK
        value: mainnet
      - key: CHAIN_ID
        value: "1"
      - key: POOL_ADDR
        value: "0x000000000Ed1eabD231Be41d93b719056F7febFC"
      - key: HEADER_RELAY_ADDR
        value: "0x20A6ddc2C6E620c6248B5A34E85996516FDd19D0"
      - key: VAPP_DEPOSIT_ADDR
        value: "0x5Ad5Bc4B18f7c173DcE17A57682Cb0Dc8788951F"
      - key: PROVE_TOKEN_ADDR
        value: "0x6BEF15D938d4E72056AC92Ea4bDD0D76B1C4ad29"
      - key: ZQUOTER_ADDR
        value: "0x000000bd2DB80567c23E353ca95a251c573cBf9B"
      # Tacit runs a GPU worker on the prover board; warn when none has polled for ten minutes.
      - key: PROVER_BOARD_EXPECT_WORKERS
        value: "1"
      - key: RUNPOD_API_KEY
        sync: false
      # The vast.ai account the GPU box and the help desk node rent on (a read-only key): warns at 48 h of credit, pages at 12 h and at zero.
      - key: VAST_API_KEY
        sync: false
      - key: ZROUTER_ADDR
        value: "0x000000000000FB114709235f1ccBFfb925F600e4"
      - key: REFLECTION_GENESIS_HEIGHT
        value: "964471"
      - key: ETH_STATE_PENDING_STALE_SECS
        value: "5400"
      - key: MAX_GAS_GWEI
        value: "5"
      - key: MIN_FLOOR_USD
        value: "0.5"
      - key: OPS_MARGIN
        value: "0.12"
      - key: BPS_CAP
        value: "30"
      # The wallets it watches, by address: the settle wallet and the relay wallet (headers, attests, the prover account).
      - key: SETTLE_ADDRESS
        value: "0x7a0F0511E1DcF399C2F7bbe8414b6a0D1ABc4331"
      - key: RELAY_ADDRESS
        value: "0x68575B073DE49a94e3E3ACf6F3A0d6E3b66267C7"
      # ── Secrets (set in dashboard): the read endpoint and the API tokens; no signing key ──
      - key: RPC_URL
        sync: false
      - key: BOX_TOKEN
        sync: false
      - key: PROVER_HEARTBEAT_TOKEN
        sync: false
      # Healthy steady state is ~HEADER_RELAY_LEAD (144) plus a few blocks of batch cadence, so this sits above it.
      - key: REFLECTION_LAG_ALERT_BLOCKS
        value: "200"
      # Cross-outs already diagnosed as unfoldable, so the fold-gap watchdog measures only the unexplained
      # remainder. Three today: one whose Bitcoin block was scanned before a bundle covering it existed (the
      # fold is one-shot, so it can never land), and two whose Bitcoin-side mints have not been broadcast.
      # Raise this ONLY after diagnosing a specific cross-out — never to quiet an unexplained gap.
      - key: CROSSOUT_FOLD_GAP_BASELINE
        value: "3"

  # Always-on web service: ETH-wrap points program (src/points-indexer.js). Reads the pool's existing
  # Wrap event + each wrap's tx sender — no contract change, nothing on the settle/reflection path. Serves
  # /leaderboard, /points/:address and /claim/:address over HTTP for the dapp. See lib/config.js's "Points
  # program" / "Points reward settlement" sections for the formula and every knob.
  #
  # Reward settlement (contracts/src/PointsDistributor.sol) is DORMANT by default: POINTS_PROGRAM_START_SEC
  # is unset below, so settleCycle no-ops and only the informational points/leaderboard run. Flip the reward
  # program on by setting POINTS_PROGRAM_START_SEC + POINTS_DISTRIBUTOR_ADDR + POINTS_ROOT_SETTER_KEY once
  # the contract is deployed and the ops multisig has funded it — no code change needed.
  - type: web
    name: tacit-points
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: starter
    dockerCommand: node src/points-indexer.js
    autoDeploy: false
    disk:
      name: points-db
      mountPath: /var/lib/tacit-points
      sizeGB: 1
    envVars:
      # DELIBERATELY NOT `fromGroup: tacit-relay-shared`. This is the one service here that listens on the
      # public internet, and that group carries RELAY_KEY, BOX_TOKEN and NETWORK_PRIVATE_KEY — a signing key
      # for every settle and attest, the token that gates the control plane including the reflection cursor
      # reseed, and the prover balance. This process calls no control-plane route: it reads Wrap events and serves a
      # leaderboard. It needs a chain endpoint and its own POINTS_* settings, so those are declared here instead.
      # Keeping the group off this service is the whole point — re-adding it would put the relay's keys back on a
      # public box, and a blueprint sync is how that silently happens.
      - key: NETWORK
        value: mainnet
      - key: CHAIN_ID
        value: "1"
      - key: POOL_ADDR
        value: "0x000000000Ed1eabD231Be41d93b719056F7febFC"
      # Its own read endpoint, separate from the relay's. Read-only eth_getLogs/eth_getBlock over a forward
      # range; it never needs the relay's provider credential.
      - key: RPC_URL
        sync: false
      # Forward-only: chain head at first deploy of this service. Re-pin to the actual deploy-time head if
      # deploying meaningfully later than when this was written (2026-09-23, mainnet head ~26,039,038) — a
      # wrap before this block is never counted, by design (no backfill).
      - key: POINTS_START_BLOCK
        value: "26039038"
      - key: POINTS_POLL_SECS
        value: "60"
      - key: POINTS_CONFIRMATIONS
        value: "12"
      # Tunable incentive knobs, not protocol parameters — see lib/config.js for the formula. Safe to
      # change without a redeploy of anything else; only affects future scans (past rows keep the points
      # they were awarded).
      - key: POINTS_BASE_PER_ETH
        value: "1000"
      - key: POINTS_BONUS_SCALE
        value: "4"
      - key: POINTS_BONUS_HALF_LIFE
        value: "200"
      # ── Reward settlement ──
      # Epoch scoring is live (settleCycle folds each UTC day into the local reward ledger, visible at
      # /rewards) so participation can be watched from day one.
      - key: POINTS_PROGRAM_START_SEC       # 2026-09-23T00:00:00Z — day 0 is the day tacit-points went live
        value: "1790121600"
      - key: POINTS_PROGRAM_DAYS
        value: "90"
      - key: POINTS_PROGRAM_TOTAL_WEI       # 100,000 TAC
        value: "100000000000000000000000"
      # From UTC day 20729 (2026-10-03) a day's pot is the lesser of its budget and 0.03 TAC per point earned
      # that day, so a quiet day cannot pay far more per point than a busy one. Applies forward only: days
      # already settled are never re-priced. Entries are "<UTC day>:<TAC per point>", comma-separated;
      # "<day>:off" lifts it. An entry can be changed or removed until its day arrives.
      - key: POINTS_RATE_CAP_SCHEDULE
        value: "20729:0.03"
      # What a day's points count for, each from a UTC day forward (lib/points-engagement.js): a weight per kind of
      # activity ("<day>:<activity>=<weight>,…", "<day>:off" ends them); a multiplier for an address's activity across
      # kinds and days in the past week ("<day>:<step per other kind>,<step for a second day>,<most other kinds>,<points
      # a kind needs>"); and the day from which a cBTC bond counts only while its escrow is still posted when the day
      # settles. An entry can be changed or removed until its day arrives; never one whose day has passed.
      # No weights at launch. A cBTC bond is scored when it is posted, which is only safe once cBTC is minted against it (the
      # engine will not release that escrow), so the bond check below also needs the mint; the daily credit pays for keeping
      # it posted. (A weight of 0 counts an activity for nothing, also toward the week's multiplier.) "<day>:off" weights nothing.
      - key: POINTS_CATEGORY_WEIGHTS
        value: "20730:off"
      - key: POINTS_ENGAGEMENT
        value: "20730:0.25,0.25,2,25"
      - key: POINTS_BOND_HOLD_FROM_DAY
        value: "20730"
      - key: POINTS_CBTC_HOLD_RATE
        value: "500"
      - key: POINTS_CBTC_HOLD_FROM_DAY
        value: "20730"
      # PointsDistributor (CreateX CREATE3, deployed 2026-09-23, salt sender-guarded to the deployer key,
      # verified on Etherscan + Sourcify). ROOT_SETTER = 0x5c1aBec44465f305f2F1AE492eEd191327EbdF3f, its
      # own dedicated key (never RELAY_KEY/SETTLE_KEY — see the contract's own header for why). Publishing
      # still needs the ops multisig to fund the distributor before the first updateRoot can succeed;
      # until then settleCycle keeps folding days locally and logs a funding-shortfall alert each cycle.
      - key: POINTS_DISTRIBUTOR_ADDR
        value: "0x000000C918e44A3a443937fA7594eA4f7C95D6b9"
      - key: POINTS_ROOT_SETTER_KEY         # secret — set in the Render dashboard
        sync: false
      # Task rewards (docs/TASKS.md): TAC for doing a listed job's step, credited as ledger adjustments beside the daily pot.
      # Off while the budget is unset or 0. The budget is the most that can ever be credited (raise it with each top-up of the
      # distributor); the end is UTC seconds and must come before the distributor's ROOT_UPDATE_DEADLINE. Tip, floor, cap and
      # the reserve days (POINTS_TASKS_TIP_BPS, _FLOOR_WEI, _CAP_WEI, _RESERVE_DAYS) have defaults in lib/config.js.
      # Both are set in the Render dashboard, never here: a blueprint sync (any push that touches this file) writes every value listed
      # in it back to the service, so a value here would switch tasks off again (it did, 2026-10-16).
      - key: POINTS_TASKS_BUDGET_WEI
        sync: false
      - key: POINTS_TASKS_END_SEC
        sync: false
      # The liquidity campaign (lib/points-lp.js): the same rule, so that a push touching this file cannot write over them. All dashboard only;
      # it is off until the schedule, the pools, the pocket and the end are all set.
      - key: POINTS_LP_SCHEDULE
        sync: false
      - key: POINTS_LP_POOLS
        sync: false
      - key: POINTS_LP_POCKET_WEI
        sync: false
      - key: POINTS_LP_END_SEC
        sync: false
      - key: POINTS_LP_FROM_BLOCK
        sync: false

  # Always-on web service: Bitcoin-native shielded pool replay (src/btc-pool-indexer.js). Replays 0x6C/0x6D
  # envelopes from raw blocks and serves roots, Merkle paths, the note feed, nullifier and exit status.
  # Client proofs are verified natively in process against the key pinned in dapp/btc-pool/pin.json; without
  # it the service halts at the first pool envelope rather than diverge.
  #
  # Built from the repo root with its own Dockerfile: the image needs worker/ and dapp/ files that the
  # worker-relay context cannot reach.
  - type: web
    name: tacit-btc-pool
    runtime: docker
    rootDir: .
    dockerfilePath: ./worker-relay/Dockerfile.btc-pool
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: node src/btc-pool-indexer.js
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: btc-pool-db
      mountPath: /var/lib/tacit-btc-pool
      sizeGB: 1
    envVars:
      # DELIBERATELY NOT `fromGroup: tacit-relay-shared`: public, read-only, signs nothing. It must not carry
      # RELAY_KEY, BOX_TOKEN or NETWORK_PRIVATE_KEY.
      - key: BTC_POOL_NETWORK
        value: signet
      # Replay starts here; set to the first block that can carry a pool envelope. Changing it requires a
      # fresh database.
      - key: BTC_POOL_START_HEIGHT
        value: "323699"
      - key: BTC_POOL_ESPLORA
        value: https://mempool.space/signet/api
      - key: BTC_POOL_CONFIRMATIONS
        value: "1"
      - key: BTC_POOL_POLL_SECS
        value: "30"
      - key: BTC_POOL_DB
        value: /var/lib/tacit-btc-pool/btc-pool-halo2-323699.db
      - key: PORT
        value: "10000"

  # Always-on web service: the same replay plus the pool relayer (src/lib/btc-pool-relayer.js), mounted at
  # /btc-pool/relay because BTC_POOL_RELAYER_* keys are set. Kept separate from tacit-btc-pool so the public
  # indexer stays keyless. The relayer key holds only its own signet coins: one confirmed coin is reserved as
  # each batch's carrier bind, the rest fund commits.
  - type: web
    name: tacit-btc-pool-relay
    runtime: docker
    rootDir: .
    dockerfilePath: ./worker-relay/Dockerfile.btc-pool
    dockerContext: .
    plan: starter
    region: oregon
