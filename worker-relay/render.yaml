  # Background worker: sends TAC back for bridges that did not complete (src/bridge-recover.js). Reads the claims the
  # API took in (POST /bridge/recover), checks each again against public chain data and the attested reflection state,
  # and sends the claimed amount from its own key to the claim's key. Built from the repo root like the faucet (it
  # loads dapp/tacit.js headlessly). No disk: each claim's progress is kept by the API and resolved from chain data.
  - type: worker
    name: tacit-bridge-recover
