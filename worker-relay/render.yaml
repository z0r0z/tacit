    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: btc-pool-relay-db
      mountPath: /var/lib/tacit-btc-pool
      sizeGB: 1
    envVars:
      # DELIBERATELY NOT `fromGroup: tacit-relay-shared`: it holds only its own signet relayer keys.
      - key: BTC_POOL_NETWORK
        value: signet
      - key: BTC_POOL_START_HEIGHT
        value: "323699"
      - key: BTC_POOL_ESPLORA
        value: https://mempool.space/signet/api
      - key: BTC_POOL_CONFIRMATIONS
        value: "1"
      - key: BTC_POOL_POLL_SECS
        value: "30"
      - key: BTC_POOL_DB
        value: /var/lib/tacit-btc-pool/btc-pool-relay-halo2-323699.db
      - key: BTC_POOL_RELAYER_MEMPOOL
        value: esplora
      # <asset hex>:<fee units>, comma-separated. Signet cBTC.
      - key: BTC_POOL_RELAYER_FEES
        value: "17619b4c65ad462481b74a59dbd566730a4376f07fb0e6ff8beca216044466c5:10"
      - key: BTC_POOL_RELAYER_BTC_KEY      # signet P2WPKH key, hex — set in the Render dashboard
        sync: false
      - key: BTC_POOL_RELAYER_POOL_SEED    # 32-byte hex pool wallet seed — set in the Render dashboard
        sync: false
      - key: PORT
        value: "10000"

  # Mainnet counterpart of tacit-btc-pool, above: same replay, keyless, public, flagged experimental.
  # The replay itself is asset-blind and indexes every asset it sees; which assets are offered is a dapp
  # decision (MAINNET_POOL_ASSETS in dapp/sats/secret.js): TAC and cBTC today.
  - type: web
    name: tacit-btc-pool-mainnet
    runtime: docker
    rootDir: .
    dockerfilePath: ./worker-relay/Dockerfile.btc-pool
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: node src/btc-pool-indexer.js
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: btc-pool-mainnet-db
      mountPath: /var/lib/tacit-btc-pool
      sizeGB: 1
    envVars:
      # DELIBERATELY NOT `fromGroup: tacit-relay-shared`: public, read-only, signs nothing.
      - key: BTC_POOL_NETWORK
        value: mainnet
      # No pool envelope can predate this deploy (mainnet opcodes were reserved-not-enabled until now), so
      # start height == the checkpoint height; nothing earlier needs replay.
      - key: BTC_POOL_START_HEIGHT
        value: "969026"
      # Header-chain trust anchor (mainnet has no built-in one, unlike signet) — real tip at the time this
      # was set, fetched from blockstream.info and independently byte-counted (64 hex chars).
      - key: BTC_POOL_CHECKPOINT
        value: "969026:00000000000000000000a6884a243291cc7424fd5e621d71b84b3158a3bda5ba"
      - key: BTC_POOL_ESPLORA
        value: https://mempool.space/api,https://blockstream.info/api,https://mempool.emzy.de/api
      - key: BTC_POOL_CONFIRMATIONS
        value: "3"
      - key: BTC_POOL_POLL_SECS
        value: "30"
      - key: BTC_POOL_DB
        value: /var/lib/tacit-btc-pool/btc-pool-mainnet-halo2-969026.db
      - key: PORT
        value: "10000"

  # Mainnet counterpart of tacit-btc-pool-relay, above. Starts once BTC_POOL_RELAYER_BTC_KEY and
  # BTC_POOL_RELAYER_POOL_SEED are set in the Render dashboard with a freshly generated mainnet keypair,
  # funded with real BTC. Shield works self-funded without this service (the depositor's own wallet
  # broadcasts the commit/reveal, same as any other Tacit Bitcoin op); this is only for gasless relay.
  # BTC_POOL_RELAYER_FEES below is a starting value — tune against real mainnet fee cost.
  - type: web
    name: tacit-btc-pool-relay-mainnet
    runtime: docker
    rootDir: .
    dockerfilePath: ./worker-relay/Dockerfile.btc-pool
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: node src/btc-pool-indexer.js
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: btc-pool-relay-mainnet-db
      mountPath: /var/lib/tacit-btc-pool
      sizeGB: 1
    envVars:
      # Silent-payment hints (src/lib/sp-hints.js): POST/GET /sp/hints, opaque sealed blobs kept 45 days.
      - key: BTC_POOL_SP_HINTS
        value: "1"
      # DELIBERATELY NOT `fromGroup: tacit-relay-shared`: it will hold only its own mainnet relayer keys.
      - key: BTC_POOL_NETWORK
        value: mainnet
      - key: BTC_POOL_START_HEIGHT
        value: "969026"
      - key: BTC_POOL_CHECKPOINT
        value: "969026:00000000000000000000a6884a243291cc7424fd5e621d71b84b3158a3bda5ba"
      - key: BTC_POOL_ESPLORA
        value: https://mempool.space/api,https://blockstream.info/api,https://mempool.emzy.de/api
      - key: BTC_POOL_CONFIRMATIONS
        value: "3"
      - key: BTC_POOL_POLL_SECS
        value: "30"
      - key: BTC_POOL_DB
        value: /var/lib/tacit-btc-pool/btc-pool-relay-mainnet-halo2-969026.db
      - key: BTC_POOL_RELAYER_MEMPOOL
        value: esplora
      # <asset hex>:<fee units>, comma-separated. TAC, in the asset's own base units (8 decimals).
      # Measured, not estimated: the first relayed carrier on mainnet cost 2,679 sats (423 commit + 2,256
      # reveal), so at TAC's ~200 sats a 10 TAC fee ran at a loss. 15 TAC covers a carrier carrying a single
      # spend with a little margin. The economics only really work batched — one carrier amortised over
      # several spends earns several fees — so this is priced for the worst case of one.
      #
      # The relayer earns TAC and pays sats, so its sats balance falls no matter what this is set to. It
      # also needs at least TWO confirmed coins at all times: one is reserved as each batch's bind, and a
      # single-coin wallet leaves nothing to fund the carrier ("relayer funding short").
      #
      # The value is a comma-separated <asset>:<units> list, so a second asset is one more entry. cBTC
      # (62a20d98fc1cd20289621d1315294cb8772f934d822e404b71e1f471cf0679c8) would read
      # ":5000" — at 8 decimals a cBTC unit is a satoshi, so a cBTC fee covers the carrier in the same
      # denomination the carrier costs. Add it only once bridged cBTC exists and the dapp lists the asset
      # live; an asset priced here but absent from the pool just advertises a fee nobody can pay.
      - key: BTC_POOL_RELAYER_FEES
        value: "f0bbe868af10c6c67652a99709bf32048d1aa7194efe3e9a1ef1bde43f94762b:1500000000"
      - key: BTC_POOL_RELAYER_ENABLE_MAINNET
        value: "1"
      - key: BTC_POOL_RELAYER_BTC_KEY      # mainnet P2WPKH key, hex — generate offline, set in the Render dashboard
        sync: false
      - key: BTC_POOL_RELAYER_POOL_SEED    # 32-byte hex pool wallet seed — generate offline, set in the Render dashboard
        sync: false
      - key: PORT
        value: "10000"

  # Always-on web service: the TAC exit-to-sats maker (src/pool-maker.js). It buys TAC out of the Bitcoin shielded pool
  # for sats and pays the payer's named script in the same carrier, so a payment settles in a block. Built from the repo
  # root (it loads dapp/ headlessly). MAKER_KEY is the wallet key that receives the exit notes it buys (its inventory)
  # and, derived from it, the coins it pays from; GET /maker/status names the coin address to fund. The state file
  # holds the openings of the notes it bought, so the disk is the only record of that inventory: keep it backed up.
  # A carrier costs about 1,200 to 2,700 sats, so MAKER_MIN_SATS keeps fills large enough for the spread to cover it.
  # DELIBERATELY NOT `fromGroup: tacit-relay-shared`.
  - type: web
    name: tacit-pool-maker
    runtime: docker
    rootDir: .
    dockerfilePath: ./worker-relay/Dockerfile.pool-maker
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: node src/pool-maker.js
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: pool-maker-state
      mountPath: /var/lib/tacit-pool-maker
      sizeGB: 1
    envVars:
      - key: MAKER_NETWORK
        value: mainnet
      - key: MAKER_STATE
        value: /var/lib/tacit-pool-maker/state.json
      # Starting limits, small on purpose: raise them as fills go through.
      - key: MAKER_MIN_SATS
        value: "40000"
      - key: MAKER_MAX_SATS
        value: "60000"
      - key: MAKER_DAILY_SATS
        value: "120000"
      - key: MAKER_KEY    # 32-byte hex wallet key — set in the Render dashboard
        sync: false
      - key: PORT
        value: "10000"

  # Always-on web service: Secret Sats signet faucet (src/sats-faucet.js). Keeps FAUCET_TARGET_LISTINGS
