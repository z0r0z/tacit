# Render blueprint — Tacit confidential-pool relay + reflection backbone.
#
# Proving is offloaded to the Succinct NETWORK prover; no GPU on Render. Two always-on
# Background Workers (settle + eth-state) plus Cron Jobs (reflection, header, monitor).
#
# The prebuilt Rust prover binaries are fetched into the image by the Dockerfile from a
# pinned GitHub release (see README). Secrets are sync:false — set them in the Render dashboard.
#
# Shared env lives in an env group so every service inherits WORKER_BASE / RPC_URL /
# addresses / Succinct config without repetition; only the secrets differ per-need.

envVarGroups:
  - name: tacit-relay-shared
    envVars:
      - key: WORKER_BASE
        value: https://api.tacit.finance   # control-plane worker base URL
      - key: NETWORK
        value: mainnet
      - key: CHAIN_ID
        value: "1"
      - key: POOL_ADDR
        value: "0x000000000Ed1eabD231Be41d93b719056F7febFC"
      - key: HEADER_RELAY_ADDR
        value: "0x20A6ddc2C6E620c6248B5A34E85996516FDd19D0"
      - key: VAPP_DEPOSIT_ADDR
        value: "0x5Ad5Bc4B18f7c173DcE17A57682Cb0Dc8788951F"
      - key: PROVE_TOKEN_ADDR
        value: "0x6BEF15D938d4E72056AC92Ea4bDD0D76B1C4ad29"
      # Deprecated the previous 0x000000a7… quoter 2026-09-23 — its buildSwapAuto had no PROVE->ETH route,
      # silently mispricing PROVE. This one has no single "auto" function either, so replenish.js's quote()
      # tries buildBestSwap + buildBestSwapViaETHMulticall and keeps the better result — see chain.js.
      - key: ZQUOTER_ADDR
        value: "0x000000bd2DB80567c23E353ca95a251c573cBf9B"
      - key: ZROUTER_ADDR
        value: "0x000000000000FB114709235f1ccBFfb925F600e4"
      - key: SP1_PROVER
        value: network
      # Mainnet/auction endpoint. The exec-* binaries build in Mainnet (auction) mode — auction gRPC calls
      # (get_proof_request_params) are Unimplemented on the Reserved endpoint (rpc.production), so this MUST be
      # the mainnet host or every network prove fails with `status: Unimplemented`.
      - key: NETWORK_RPC_URL
        value: https://rpc.mainnet.succinct.xyz
      # The pool verifies ONE immutable program_vkey. A prover binary built against a different guest
      # produces proofs that generate fine and are rejected on-chain, with nothing in the logs to say so.
      # Pinning the expected vkey here makes the harness assert it at startup and fail loudly instead. Rotate this together with
      # the guest ELF pin and the on-chain program_vkey; never on its own.
      - key: EXPECT_VKEY
        value: "0x006cd47fd23937a6d247696cace28c22d2c6a8280447e6ac45a3571de232d6e3"
      - key: BITCOIN_PROVE_BIN
        value: /app/prover/bin/bitcoin_prove
      - key: EXEC_BIN
        value: /app/prover/bin/exec
      # Fee economics (see src/replenish.js quoteRelayFee)
      - key: MIN_FLOOR_USD
        value: "0.5"
      - key: OPS_MARGIN
        value: "0.12"
      - key: BPS_CAP
        value: "30"
      # ── Secrets (set in dashboard) ──
      - key: RPC_URL
        sync: false
      - key: RELAY_KEY
        sync: false
      - key: BOX_TOKEN
        sync: false
      # Must equal the worker's PROVER_HEARTBEAT_TOKEN. Without it every heartbeat is rejected 401 and
      # /prover-health reports these services down forever — which is how a wedged lane goes unnoticed.
      - key: PROVER_HEARTBEAT_TOKEN
        sync: false
      - key: NETWORK_PRIVATE_KEY
        sync: false
      # Every service's escalation channel, not just the monitor's. header-relay.js has its own alert() and it
      # is the SOLE escalation for a Bitcoin fork deeper than HEADER_RELAY_REORG_DEPTH — the one event meaning
      # the light relay's view of the chain was materially wrong. Scoped to tacit-monitor alone, that alert
      # no-opped into the logs, and because the header cron SUCCEEDS while restoring, Render's failed-run
      # signal never fired either. Same for the eth-state sidecar's own stall escalation.
      - key: ALERT_WEBHOOK_URL
        sync: false

services:
  # Cron ($ = runtime only): incremental Bitcoin-state reflection attester. A 5-min cron keeps
  # pace with Bitcoin's ~10-min blocks (lag ≪ the ~60-min maturity window) — no always-on worker
  # needed. RUN_MODE=cron drains pending batches then exits. Switch type→worker for zero-lag.
  - type: cron
    name: tacit-reflection
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: standard
    schedule: "*/5 * * * *"
    dockerCommand: node src/reflection-folder.js
    autoDeploy: false
    envVars:
      - fromGroup: tacit-relay-shared
      - key: RUN_MODE
        value: cron

  # Cron: BitcoinLightRelay header feeder — submits BTC headers (advanceTip) so the relay confirms blocks
  # ahead of reflection. No proving; just fetch headers + one on-chain tx. Paced to stay ≤ HEADER_RELAY_LEAD
  # ahead of reflection's attested height (maturity-window constraint).
  - type: cron
    name: tacit-header
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "*/3 * * * *"
    dockerCommand: node src/header-relay.js
    autoDeploy: false
    envVars:
      - fromGroup: tacit-relay-shared
      - key: RUN_MODE
        value: cron

  # Always-on worker: Mode-B eth-state producer (src/eth-state-sidecar.js). Publishes the eth-side
  # crossOut/consumed candidate tacit-reflection's ethBundleSource needs for every Mode-B attest — see
  # that file's header comment for why this must track "is a candidate currently live," not
  # crossOutCount, and self-paces to roughly one real eth_prove run per Bitcoin-side attest.
  # NOT type: cron — eth_prove keeps its own cumulative resume state on a local file across cycles
  # (out_dir()/eth_set_state.json); a cron's fresh-container-per-run would force a full eth_getLogs
  # rescan from DEPLOY_BLOCK on every single invocation, growing without bound as history accumulates.
  # The attached disk makes that state (and the pending eth_set_state.pending.json) survive
  # restarts/redeploys too — losing it is a one-time expensive rescan, not a correctness issue (see
  # prover.js's proveEthState comment), but avoid relying on that as normal operation.
  #
  # DO NOT deploy this without first setting the REAL secrets below AND confirming SOURCE_CONSENSUS_RPC/
  # SOURCE_EXECUTION_RPC/DEPLOY_BLOCK/GENESIS_SLOT/ETH_CALL_OUTBOX match the live deployment
  # (re-pin them for a successor deployment). Start with DRY_RUN=1 for at least
  # one full cycle against production before removing it (validates the trigger + API wiring with zero
  # proving spend).
  - type: worker
    name: tacit-eth-state
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: standard
    dockerCommand: node src/eth-state-sidecar.js
    autoDeploy: false
    disk:
      name: eth-prove-state
      mountPath: /var/lib/tacit-eth-prove
      sizeGB: 5
    envVars:
      - fromGroup: tacit-relay-shared     # reuses NETWORK_PRIVATE_KEY, BOX_TOKEN, SP1_PROVER, NETWORK_RPC_URL
      - key: ETH_PROVE_BIN
        value: /app/prover/bin/eth_prove   # fetched into the image by the Dockerfile
      - key: DRY_RUN
        value: "0"
      - key: ETH_STATE_POLL_SECS
        value: "60"
      # ── deployment-pinned constants — re-pin for a successor deployment ──
      - key: SOURCE_CONSENSUS_RPC
        value: https://ethereum-beacon-api.publicnode.com
      - key: SOURCE_CHAIN_ID
        value: "1"
      - key: SOURCE_EXECUTION_RPC
        value: https://mainnet.gateway.tenderly.co
      - key: SOURCE_PROOF_RPC
        value: https://eth-mainnet.public.blastapi.io
      - key: ETH_CALL_OUTBOX
        value: "0x00000000a26a6E291972666a9687741dBa11Af46"
      - key: DEPLOY_BLOCK
        value: "25998736"
      # The resume digest carries the sync committee the last Mode-B cycle ended on; the eth proof must
      # bootstrap from a slot in that period, since an older bootstrap replays periods the network refuses as
      # unexecutable. Chained mode then follows the committed state's landed slot, so no fixed
      # committee pin is set: the expected committee advances every period and the assembler checks it per job.
      - key: GENESIS_SLOT
        value: "15237120"
      - key: SYNC_COMMITTEE_MODE
        value: chained
      - key: SCAN_CHUNK
        value: "300"
      - key: SCAN_DELAY_MS
        value: "600"
      - key: ETHPROVE_CYCLE_LIMIT
        value: "3000000000"
      - key: ETHPROVE_GAS_LIMIT
        value: "3000000000"

  # Always-on worker: confidential settle relay (user ops). Polls the queue every SETTLE_POLL_SECS
  # and proves+settles immediately — no 2-min cron lag, so a user's wrap/send/top-up settles promptly.
  # (Revert to a per-run Cron Job by setting type: cron + schedule + RUN_MODE=cron if cost matters more.)
  - type: worker
    name: tacit-settle
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    # Standard (2GB): the SP1 network-prove client spikes past 512MB (Starter) when it retrieves + deserializes
    # the groth16 proof, so it needs 2GB.
    plan: standard
    dockerCommand: node src/settle-relay.js
    autoDeploy: false
    envVars:
      - fromGroup: tacit-relay-shared
      # No per-service POOL_ADDR override: the group's POOL_ADDR is the single source for every service.
      - key: SETTLE_JOB_TIMEOUT_SECS
        value: "900"
      # Tight poll so a queued job starts proving within ~3s — the worker is always-on, so the extra idle GETs
      # are cheap.
      - key: SETTLE_POLL_SECS
        value: "3"
      # Ceiling, not a target: the relay batches whatever is already queued and never waits to fill, so a
      # lone op still settles immediately on the single-op path. Gas is charged per settle, so batch members
      # split it (proving is per-op and does not amortize). 1 disables batching.
      - key: SETTLE_BATCH_MAX
        value: "8"
      # Ordered PRIVATE submission endpoints. A settle pays its bound fee to msg.sender, so it is kept out of
      # the public mempool; several endpoints mean one refusing a valid tx does not discard a paid proof.
      - key: SETTLE_RPC_URLS
        value: "https://rpc.flashbots.net,https://rpc.mevblocker.io"
      # Last resort after every private endpoint refuses: the user's op still settles, though the bound fee
      # may go to another submitter. 0 keeps submission private-only.
      - key: SETTLE_ALLOW_PUBLIC
        value: "1"
      # One key. The settle service signs with RELAY_KEY (the account behind the network prover key, the vApp
      # depositor and the maintenance wallet), so fee income lands on the wallet that can use it. Do not add a
      # separate SETTLE_KEY: it splits fees from the account that funds proving.
      #
      # Fee income -> ETH gas + PROVE, swept from inside this service during idle time (see replenishOnce).
      - key: REPLENISH_IN_SETTLE
        value: "1"
      - key: REPLENISH_INTERVAL_MIN
        value: "30"
      - key: FEE_ASSETS
        value: "0x0000000000000000000000000000000000000000,0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48,0xdAC17F958D2ee523a2206206994597C13D831ec7,0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0"

  # Inert. Replenish runs inside tacit-settle, in the loop's idle time (REPLENISH_IN_SETTLE), because that is
  # where the fee income lands and it serialises with settles on the one relayer key's nonce. Kept defined, inert
  # and suspended so a blueprint sync cannot start a second replenisher on the same wallet's nonces. Do not point
  # this at src/replenish.js.
  - type: cron
    name: tacit-replenish
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "0 0 1 1 *"
    dockerCommand: 'echo tacit-replenish is retired - replenish runs inside tacit-settle'
    autoDeploy: false
    envVars:
      - fromGroup: tacit-relay-shared

  # Cron: balance + reflection-lag pager.
  - type: cron
    name: tacit-monitor
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: starter
    schedule: "*/5 * * * *"
    dockerCommand: node src/balance-monitor.js
    autoDeploy: false
    envVars:
      - fromGroup: tacit-relay-shared
      - key: PROVE_BALANCE_FLOOR
        value: "50"
      - key: ETH_GAS_BUFFER_WEI
        value: "30000000000000000"
      # Healthy steady state is ~HEADER_RELAY_LEAD (144) plus a few blocks of batch cadence, so this sits above it.
      - key: REFLECTION_LAG_ALERT_BLOCKS
        value: "200"

  # Always-on web service: ETH-wrap points program (src/points-indexer.js). Reads the pool's existing
  # Wrap event + each wrap's tx sender — no contract change, nothing on the settle/reflection path. Serves
  # /leaderboard, /points/:address and /claim/:address over HTTP for the dapp. See lib/config.js's "Points
  # program" / "Points reward settlement" sections for the formula and every knob.
  #
  # Reward settlement (contracts/src/PointsDistributor.sol) is DORMANT by default: POINTS_PROGRAM_START_SEC
  # is unset below, so settleCycle no-ops and only the informational points/leaderboard run. Flip the reward
  # program on by setting POINTS_PROGRAM_START_SEC + POINTS_DISTRIBUTOR_ADDR + POINTS_ROOT_SETTER_KEY once
  # the contract is deployed and the ops multisig has funded it — no code change needed.
  - type: web
    name: tacit-points
    runtime: docker
    rootDir: worker-relay
    dockerfilePath: ./Dockerfile
    plan: starter
    dockerCommand: node src/points-indexer.js
    autoDeploy: false
    disk:
      name: points-db
      mountPath: /var/lib/tacit-points
      sizeGB: 1
    envVars:
      - fromGroup: tacit-relay-shared
      # Forward-only: chain head at first deploy of this service. Re-pin to the actual deploy-time head if
      # deploying meaningfully later than when this was written (2026-09-23, mainnet head ~26,039,038) — a
      # wrap before this block is never counted, by design (no backfill).
      - key: POINTS_START_BLOCK
        value: "26039038"
      - key: POINTS_POLL_SECS
        value: "60"
      - key: POINTS_CONFIRMATIONS
        value: "12"
      # Tunable incentive knobs, not protocol parameters — see lib/config.js for the formula. Safe to
      # change without a redeploy of anything else; only affects future scans (past rows keep the points
      # they were awarded).
      - key: POINTS_BASE_PER_ETH
        value: "1000"
      - key: POINTS_BONUS_SCALE
        value: "4"
      - key: POINTS_BONUS_HALF_LIFE
        value: "200"
      # ── Reward settlement ──
      # Epoch scoring is live (settleCycle folds each UTC day into the local reward ledger, visible at
      # /rewards) so participation can be watched from day one.
      - key: POINTS_PROGRAM_START_SEC       # 2026-09-23T00:00:00Z — day 0 is the day tacit-points went live
        value: "1790121600"
      - key: POINTS_PROGRAM_DAYS
        value: "90"
      - key: POINTS_PROGRAM_TOTAL_WEI       # 100,000 TAC
        value: "100000000000000000000000"
      # PointsDistributor (CreateX CREATE3, deployed 2026-09-23, salt sender-guarded to the deployer key,
      # verified on Etherscan + Sourcify). ROOT_SETTER = 0x5c1aBec44465f305f2F1AE492eEd191327EbdF3f, its
      # own dedicated key (never RELAY_KEY/SETTLE_KEY — see the contract's own header for why). Publishing
      # still needs the ops multisig to fund the distributor before the first updateRoot can succeed;
      # until then settleCycle keeps folding days locally and logs a funding-shortfall alert each cycle.
      - key: POINTS_DISTRIBUTOR_ADDR
        value: "0x000000C918e44A3a443937fA7594eA4f7C95D6b9"
      - key: POINTS_ROOT_SETTER_KEY         # secret — set in the Render dashboard
        sync: false
