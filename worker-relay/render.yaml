        value: https://api.tacit.finance
      - key: RECOVER_KEY             # P2WPKH key holding the TAC it sends, hex — set in the Render dashboard
        sync: false
      - key: CONFIDENTIAL_BOX_TOKEN  # the API's box token — set in the Render dashboard
        sync: false
      - key: RECOVER_FEE_KEY         # optional: a key whose plain sats top up the fee money — set in the Render dashboard
        sync: false

