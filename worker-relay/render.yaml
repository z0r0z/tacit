  # The fast bridge liquidity provider (fastbridge-lp/server.mjs, README there): NOT CREATED. One process per key, always on: two on one key would
  # lock the same swap twice, so never scale it past one instance. Its key is the provider's Bitcoin wallet, pool identity and swap-seed root; it is
  # set in the Render dashboard (FB_LP_KEY, `openssl rand -hex 32`) and nowhere else, and it is NOT in `tacit-relay-shared`. The swap records on the
  # disk are its safety state: keep the disk, and take snapshots. Tune it with the variables below (a change restarts it; open swaps are read back
  # and finished). To stop taking new swaps set FB_LP_MAX_AMOUNT to 0: it quotes nothing and finishes what is open. On the first start it logs the
  # Bitcoin address, the claim key and the pool account to fund (shield TAC to that account): the pool TAC is what it can lend.
  # The first read of the pool takes about two minutes on an empty disk and the ad appears after it; the scan is kept on the disk, so a restart is quick.
