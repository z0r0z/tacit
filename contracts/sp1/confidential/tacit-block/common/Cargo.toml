[package]
name = "tacit-block-common"
version = "0.1.0"
edition = "2021"

[dependencies]
btc-pool-halo2 = { path = "../../btc-pool-halo2" }
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", tag = "v0.3.0", default-features = false, features = ["batch"] }
ff = "0.13"
sha2 = { version = "0.10", features = ["compress"] }

[target.'cfg(target_os = "zkvm")'.dependencies]
sp1-lib = "=6.2.3"
