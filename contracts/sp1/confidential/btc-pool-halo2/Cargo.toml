[package]
name = "btc-pool-halo2"
version = "0.1.0"
edition = "2021"

# Halo2 (PSE halo2_proofs v0.3.0, KZG/BN254, SHPLONK) port of dapp/circuits/btc-pool/spend.circom.
# SRS: Hermez pot18 converted to ParamsKZG (src/srs.rs). Standalone.
#   cargo test --release                      model, vectors, proofs, negatives, SRS (needs the pinned ptau)
#   cargo run --release --bin btc-pool-halo2  srs | keygen | prove | check | sample
#   cargo run --release --bin btc-pool-verify [--params F] [--vk F] [--expect-vk HEX] PROOF.json
#   cargo run --release --bin btc-pool-bench  [runs]        (RAYON_NUM_THREADS=1 for one thread)
#   wasm/build.sh; node wasm/bench-node.cjs; node wasm/bench-chrome.mjs threads|single [runs] [threads]
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook", "getrandom/js"]
wasm-threads = ["wasm", "dep:wasm-bindgen-rayon"]

[dependencies]
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2", tag = "v0.3.0", default-features = false, features = ["batch"] }
ff = "0.13"
group = "0.13"
num-bigint = "0.4"
num-traits = "0.2"
sha2 = "0.10"
blake2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
rayon = "1"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 3
