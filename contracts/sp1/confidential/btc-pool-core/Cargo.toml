[package]
name = "btc-pool-core"
version = "0.1.0"
edition = "2021"

# Spend relation of the Bitcoin-native shielded pool (DESIGN-btc-shielded-pool.md §2-§4). Its own crate so
# the settle and reflection guests, which link cxfer-core, never compile it.

[dependencies]
cxfer-core = { path = "../cxfer-core" }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
