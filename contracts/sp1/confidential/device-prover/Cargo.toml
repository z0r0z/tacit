# tacit-prover: proves Tacit V1 settle ops on the user's own machine, so a wrap (or a transfer, unwrap or stealth send)
# needs no outside prover. The page reaches it on 127.0.0.1 (dapp/device-prover.js); see README.md.
#
#   cargo build --release            # macOS (Apple silicon or Intel) or Linux; Go and a C compiler for the Groth16 step
#   ./target/release/tacit-prover    # serve on 127.0.0.1:47815
#
# The four [patch] crates change how the prover computes, never what: each produces the same field elements as the crate
# it replaces, so proofs are byte-for-byte what stock SP1 would make (see README.md).
[package]
name = "tacit-prover"
version = "0.1.0"
edition = "2021"
license = "MIT"
[workspace]

[[bin]]
name = "tacit-prover"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "=6.2.3", features = ["blocking", "native-gnark"] }
slop-bn254 = "6"
slop-koala-bear = "6"
slop-symmetric = "6"
slop-algebra = "6"
slop-challenger = "6"
tacit-leafhash = { path = "crates/leafhash" }
sp1-recursion-gnark-ffi = { version = "=6.2.4", features = ["native"] }   # the patched one: check() runs the lean prover's self-test
hex = "0.4"
bincode = "1.3.3"
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tiny-keccak = { version = "2", features = ["keccak"] }   # salt.rs: the deploy salts mined between proofs
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3

[patch.crates-io]
sp1-recursion-gnark-ffi = { path = "patches/sp1-recursion-gnark-ffi" }
p3-bn254-fr = { path = "patches/p3-bn254-fr" }
p3-challenger = { path = "patches/p3-challenger" }
p3-koala-bear = { path = "patches/p3-koala-bear" }
p3-field = { path = "patches/p3-field" }
p3-merkle-tree = { path = "patches/p3-merkle-tree" }
p3-symmetric = { path = "patches/p3-symmetric" }
