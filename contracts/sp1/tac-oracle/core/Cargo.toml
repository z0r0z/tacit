# What the TacProvenOracle program proves, as a plain library: the SP1 program, the host and the tests run the same code.
[package]
name = "tac-oracle-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# keccak through tiny-keccak, which the SP1 program patches onto the zkVM's precompile.
alloy-primitives = { version = "1.3.0", default-features = false, features = ["std", "serde", "rlp", "tiny-keccak"] }
alloy-rlp = "0.3.15"
# 0.9.7 and later refuse a truncated proof as proof of absence.
alloy-trie = { version = "0.9.9", default-features = false, features = ["std", "ethereum"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
bincode = "1.3.3"

[workspace]
