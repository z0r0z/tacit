# Vendored fork of sp1-helios-primitives (https://github.com/succinctlabs/sp1-helios, rev bbc1d66),
# with the slot-120 zero-value exclusion-proof fix applied (see ../../SLOT120-EXCLUSION-FIX.md).
# The upstream crate treats a claimed-zero storage slot as an inclusion proof, but the EVM deletes
# zero-valued slots from the trie entirely, so a genuinely-zero slot can only ever produce an
# exclusion proof -- the fast-lane freshness read at count 0 (bitcoinConsumedCount on a fresh pool)
# fails closed against upstream's code. Vendored (not just git-pinned to a fork) so this survives
# independently of any external prover box's local state -- that local-patch-only fix regressed
# silently once before when the box's ephemeral filesystem was rebuilt.
[package]
name = "sp1-helios-primitives"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
helios-consensus-core = { git = "https://github.com/a16z/helios", tag = "0.11.1" }
alloy-sol-types = "1.3.0"
alloy-primitives = { version = "1.3.0", features = ["sha3-keccak", "serde"] }
alloy-trie = "0.9.5"
alloy-rlp = "0.3.15"
anyhow = "1"
